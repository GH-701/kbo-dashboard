name: KBO Daily Baseball Notification

on:
  schedule:
    # 매일 한국 시간 기준 오전 9시 (UTC 00:00), 오후 9시 (UTC 12:00) 자동 실행
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch: # GitHub 웹에서 수동으로 [Run workflow] 버튼을 눌러 즉시 실행 가능

jobs:
  kbo-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run KBO Daily Briefing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python send_daily_briefing.py

